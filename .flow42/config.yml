schema_version: 1
forge: github
harness: auto
execution_environment: auto
base_branch: main
concurrency: 4
worktree_parent: auto
commands:
  format: []
  lint: [shellcheck, scripts/check-parity.sh, scripts/validate.sh, tests/conformance.sh, tests/contracts.sh]
  typecheck: []
  test: [sh, tests/conformance.sh]
  build: []
model_profiles:
  frontier: auto
  worker: auto
  utility: auto
protected_paths:
  - .github/workflows
  - .claude-plugin
  - .codex-plugin
  - core
  - skills
mandatory_gates:
  - high-risk-plan
  - irreversible-action
  - merge
  - deploy
