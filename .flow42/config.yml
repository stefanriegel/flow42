schema_version: 3
forge: github
base_branch: main
concurrency: 4
worktree_parent: auto
commands:
  format: []
  lint: []
  typecheck: []
  test: [tests/structure.sh]
  build: []
protected_paths:
  - .github/workflows
  - skills
  - tests
mandatory_gates:
  - high-risk-plan
  - irreversible-action
  - merge
  - deploy
model_profiles:
  frontier: {agent: auto, model: auto, effort: high}
  worker: {agent: auto, model: auto, effort: medium}
  utility: {agent: auto, model: auto, effort: low}
