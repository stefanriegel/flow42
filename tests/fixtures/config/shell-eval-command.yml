schema_version: 1
forge: auto
harness: auto
execution_environment: auto
base_branch: main
concurrency: 4
worktree_parent: auto
model_profiles:
  frontier: auto
  worker: auto
  utility: auto
commands:
  format: [auto]
  lint: [auto]
  typecheck: [auto]
  test: [sh, -c, echo]
  build: [auto]
protected_paths: []
mandatory_gates:
  - high-risk-plan
  - irreversible-action
  - merge
  - deploy
