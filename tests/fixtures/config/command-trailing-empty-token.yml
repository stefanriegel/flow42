schema_version: 1
forge: github
harness: auto
execution_environment: auto
base_branch: main
concurrency: 4
worktree_parent: auto
commands:
  format: []
  lint: [sh, tests/contracts.sh, ]
  typecheck: []
  test: [sh, tests/conformance.sh]
  build: []
model_profiles:
  frontier: auto
  worker: auto
  utility: auto
protected_paths: []
mandatory_gates:
  - high-risk-plan
  - irreversible-action
  - merge
  - deploy
