name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: sh scripts/check-parity.sh
      - run: sh scripts/validate.sh
      - run: sh tests/conformance.sh
      - run: sh tests/contracts.sh
      - run: sh tests/active-work.sh
