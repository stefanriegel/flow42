name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: sh scripts/check-parity.sh
      - run: sh scripts/validate.sh
      - run: sh tests/conformance.sh
      - run: sh tests/contracts.sh
      - run: sh tests/config-approval.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sh tests/config-approval-adversarial.sh
      - run: sh tests/active-work.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sh tests/security.sh
      - run: sh evals/run.sh
      - run: sh evals/cases/run.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - run: shellcheck scripts/*.sh tests/*.sh
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ github.token }}

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: sh tests/dependencies.sh
